<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Sistema CadProd</title>
</head>
<body>
    <h1>Sistema CadProd - 1.0</h1>
    <h2>Produtos</h2>
     <form action="">
<div class="produtos">
    <label for="">Nome</label>
</div>
    <input type="text" name="username" id="username" placeholder="Insira nome do produto">
<div class="produtos">
    <label for="">Valor</label>
</div>
    <input type="text" name="valor" id="valor" placeholder="Insira o valor do produto">
<div class="produtos">
    <label for="">Quantidade</label>
</div>
    <input type="number" name="quantidade" id="quantidade" placeholder="Quantidade">
<div class="produtos">
<label for="">Total</label>
</div>
<input type="text" name="total" id="total" placeholder="Total">
<div class="pro-submit">
    <input type="submit" value="Cadastrar">
</div>
</form>

<script src="script2.js"></script>
</body>
</html>
