<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Sistema CadProd</title>
</head>
<body>
    <h1>Sistema CadProd - 1.0</h1>
    <h2>Produtos</h2>

    <form action="cad.php" method="POST">
        <div class="produtos">
            <label for="produto">Nome</label>
        </div>
        <input type="text" name="produto" id="produto" placeholder="Insira nome do produto" required>

        <div class="produtos">
            <label for="preco">Valor</label>
        </div>
        <input type="text" name="preco" id="preco" placeholder="Insira o valor do produto" required>

        <div class="produtos">
            <label for="quantidade">Quantidade</label>
        </div>
        <input type="number" name="quantidade" id="quantidade" placeholder="Quantidade" required>

        <div class="produtos">
            <label for="total">Total (visualização)</label>
        </div>
        <input type="text" id="total" placeholder="Total" readonly>

        <div class="pro-submit">
            <input type="submit" value="Cadastrar">
        </div>
    </form>

    <script src="script2.js"></script>
</body>
</html>
