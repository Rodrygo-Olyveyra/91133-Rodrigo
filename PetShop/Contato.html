<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylecontato.css">
    <title>Contato</title>
</head>
<body>
    <header>
        <img src="Imagens/pet-logo.jpg" alt="Logo Pet-Shop">
        
        <nav>
            <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="Servicos.html">Serviços</a></li>
            <li><a href="Sobre Nos.html">Sobre Nós</a></li>
            <li><a href="Contato.html">Contato</a></li>
        </ul>
        </nav>
        
    </header>

    <main>
        <section class="contato">
            <h1>Fale Conosco</h1>
            <form action="#">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome">
        
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Seu e-mail">
        
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" placeholder="Sua mensagem"></textarea>
        
                <button type="submit">Enviar</button>
              </form>
        </section>
        <section class="whatsapp-contato">
            <h2>Ou fale diretamente pelo WhatsApp</h2>
            <a href="https://wa.me/5591999999999" class="whatsapp-botao" target="_blank">
              <img src="Imagens/whatsapp.png" alt="WhatsApp">
              Enviar mensagem no WhatsApp
            </a>
          </section>
    </main>
    <footer>
        <p>© 2024 Pet Shop Alegria Animal. Todos os direitos reservados.</p>
      </footer>
</body>
</html>
